<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGame Runtime</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <select id="project" title="Projeto"></select>
      <button id="restart" title="Reiniciar (R após fim de jogo)">Restart</button>
      <button id="pause">Pause</button>
      <button id="step" title="Avança 1 frame (pausado)">Step</button>
      <label><input type="checkbox" id="debug" /> Debug</label>
      <span id="status" class="status"></span>
    </header>
    <main class="stage">
      <canvas id="game" tabindex="0"></canvas>
    </main>
    <section class="console" id="console" aria-label="Console"></section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

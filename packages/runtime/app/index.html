<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGame Runtime</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <select id="project" title="Projeto"></select>
      <button id="toggleHierarchy" hidden title="Mostra / esconde a hierarquia (cenas e entidades)">Hierarquia</button>
      <button id="toggleInspector" hidden title="Mostra / esconde o inspector (componentes da entidade selecionada)">Inspector</button>
      <button id="toggleAssets" hidden title="Mostra / esconde o navegador de assets (imagens, áudio, prefabs, scripts)">Assets</button>
      <button id="toggleEdit" hidden title="Modo edição: pausa o jogo; clique seleciona, arrastar move a entidade (salvo no arquivo da cena), roda = zoom, arrastar o fundo = mover a câmera">Editar</button>
      <button id="restart" title="Reiniciar (R após fim de jogo)">Restart</button>
      <button id="pause">Pause</button>
      <button id="step" title="Avança 1 frame (pausado)">Step</button>
      <button id="clearSave" title="Apaga os dados salvos (game.storage) e os slots de save deste jogo">Apagar save</button>
      <label><input type="checkbox" id="debug" /> Debug</label>
      <label title="Ao editar arquivos, o jogo recarrega mantendo cena, posições, variáveis e progresso (o que o arquivo mudou vale a edição). Desligado: recomeça do início."><input type="checkbox" id="keepState" /> Manter estado</label>
      <label title="Som do jogo (efeitos e música)"><input type="checkbox" id="sound" /> Som</label>
      <label title="Mostra ao vivo a run que o agente está jogando"><input type="checkbox" id="follow" /> Seguir agente</label>
      <span id="status" class="status"></span>
    </header>
    <div class="workspace">
      <aside class="hierarchy" id="hierarchy" aria-label="Hierarquia" hidden></aside>
      <main class="stage">
        <canvas id="game" tabindex="0"></canvas>
      </main>
      <aside class="inspector" id="inspector" aria-label="Inspector" hidden></aside>
    </div>
    <section class="assets" id="assets" aria-label="Assets" hidden></section>
    <section class="console" id="console" aria-label="Console"></section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>VibeGame</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* A game, not a page: no pinch zoom, double-tap zoom, pull-to-refresh, selection or callouts. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: absolute;
        display: block;
        outline: none;
      }
      canvas.pixelated {
        image-rendering: pixelated;
      }
      /* Receives the phone keyboard's typing (see attachTextField); 16px avoids the iOS zoom on focus. */
      #text {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        font-size: 16px;
      }
      #rotate {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font: 64px/1 system-ui, sans-serif;
      }
      #rotate[hidden] {
        display: none;
      }
      #error {
        position: absolute;
        inset: 0;
        padding: 24px;
        color: #ffb4a8;
        font: 14px/1.5 system-ui, sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <input id="text" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Texto" />
    <div id="rotate" hidden aria-label="Gire o aparelho">📱↻</div>
    <div id="error" hidden></div>
    <script type="module" src="./player.ts"></script>
  </body>
</html>
